<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Penang Food Map</title>

  <!-- Leaflet map library: no Google Maps API key needed for this demo -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root {
      --panel-bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #dddddd;
      --accent: #1a73e8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #f5f5f5;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .list-toggle {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 500;
      border: 1px solid rgba(0, 0, 0, .14);
      border-radius: 8px;
      padding: 9px 12px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
      cursor: pointer;
    }

    header {
      padding: 12px 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    #map {
      height: 52vh;
      height: 52dvh;
      min-height: 320px;
      width: 100%;
    }

    .app.list-hidden #map {
      height: 100vh;
      height: 100dvh;
    }

    .app.list-hidden .side {
      display: none;
    }

    .panel {
      flex: 1;
      overflow-y: auto;
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      padding: 12px;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      white-space: nowrap;
    }

    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .place-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }

    .place-card h2 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .meta {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .actions a,
    .actions button {
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      text-decoration: none;
      background: #eef4ff;
      color: var(--accent);
      cursor: pointer;
    }

    .status {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .popup-hours {
      margin: 8px 0;
      line-height: 1.45;
    }

    @media (min-width: 760px) {
      .app {
        flex-direction: row;
      }

      #map {
        height: 100vh;
        height: 100dvh;
        width: 60%;
      }

      .app.list-hidden #map {
        width: 100%;
      }

      .side {
        width: 40%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      header {
        border-left: 1px solid var(--border);
      }

      .panel {
        border-left: 1px solid var(--border);
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <button class="list-toggle" id="listToggle" type="button" aria-expanded="true" aria-controls="sidePanel">
      Hide list
    </button>

    <div id="map"></div>

    <div class="side" id="sidePanel">
      <header>
        <h1>Penang Food Map</h1>
      </header>

      <main class="panel">
        <div id="locationStatus" class="status">
          Asking for your location…
        </div>

        <div class="controls" id="filters"></div>

        <div id="placeList"></div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const status = document.getElementById("locationStatus");

    if (!window.L) {
      status.textContent = "Map library could not load. Check your internet connection, then reload this page.";
      throw new Error("Leaflet failed to load");
    }

    let places = [];

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"' && inQuotes && nextChar === '"') {
          value += '"';
          i += 1;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === "," && !inQuotes) {
          row.push(value);
          value = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && nextChar === "\n") {
            i += 1;
          }
          row.push(value);
          if (row.some(cell => cell.trim() !== "")) {
            rows.push(row);
          }
          row = [];
          value = "";
        } else {
          value += char;
        }
      }

      row.push(value);
      if (row.some(cell => cell.trim() !== "")) {
        rows.push(row);
      }

      return rows;
    }

    function getColumnValue(row, columnIndex, names, fallbackIndex = null) {
      const key = names.find(name => columnIndex[name] !== undefined);
      if (key !== undefined) {
        return row[columnIndex[key]] || "";
      }

      return fallbackIndex === null ? "" : row[fallbackIndex] || "";
    }

    function extractCoordinatesFromGoogleMapsUrl(url) {
      const decodedUrl = decodeURIComponent(url);
      const exactMatch = decodedUrl.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
      const viewportMatch = decodedUrl.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?),/);
      const match = exactMatch || viewportMatch;

      if (!match) {
        return { lat: null, lng: null };
      }

      const lat = Number.parseFloat(match[1]);
      const lng = Number.parseFloat(match[2]);

      return {
        lat: Number.isFinite(lat) ? lat : null,
        lng: Number.isFinite(lng) ? lng : null
      };
    }

    function csvRowsToPlaces(rows) {
      const [headers, ...dataRows] = rows;
      const columnIndex = Object.fromEntries(
        headers.map((header, index) => [header.trim(), index])
      );
      let currentType = "";

      return dataRows
        .map(row => {
          const type = getColumnValue(row, columnIndex, ["Food Type", "Type"], 0).trim();
          if (type) {
            currentType = type;
          }

          const name = getColumnValue(row, columnIndex, ["Name"], 1).trim();
          const googleMapsUrl = getColumnValue(
            row,
            columnIndex,
            ["Google Maps Link", "Google Maps URL", "Maps Link", "Link", ""],
            2
          ).trim();
          const openingHours = getColumnValue(row, columnIndex, ["Opening Hours", "Hours"], 3).trim();
          const explicitLat = Number.parseFloat(getColumnValue(row, columnIndex, ["Lat", "Latitude"]).trim());
          const explicitLng = Number.parseFloat(getColumnValue(row, columnIndex, ["Lng", "Longitude"]).trim());
          const urlCoordinates = extractCoordinatesFromGoogleMapsUrl(googleMapsUrl);
          const lat = Number.isFinite(explicitLat) ? explicitLat : urlCoordinates.lat;
          const lng = Number.isFinite(explicitLng) ? explicitLng : urlCoordinates.lng;

          if (!name) {
            return null;
          }

          return {
            name,
            type: currentType || "Other",
            lat: Number.isFinite(lat) ? lat : null,
            lng: Number.isFinite(lng) ? lng : null,
            openingHours,
            googleMapsUrl: googleMapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`
          };
        })
        .filter(Boolean);
    }

    async function loadPlaces() {
      status.textContent = "Loading locations...";

      const response = await fetch("locations.csv");
      if (!response.ok) {
        throw new Error(`Could not load locations.csv (${response.status})`);
      }

      const csvText = await response.text();
      places = csvRowsToPlaces(parseCsv(csvText));
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    const defaultCenter = [5.4141, 100.3288]; // George Town, Penang

    const map = L.map("map", {
      zoomControl: true
    }).setView(defaultCenter, 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }).addTo(map);

    const markers = [];
    let activeType = "All";
    let userLocation = null;

    function setupListToggle() {
      const app = document.getElementById("app");
      const toggle = document.getElementById("listToggle");

      toggle.addEventListener("click", () => {
        const isHidden = app.classList.toggle("list-hidden");
        toggle.textContent = isHidden ? "Show list" : "Hide list";
        toggle.setAttribute("aria-expanded", String(!isHidden));
        setTimeout(() => map.invalidateSize(), 250);
      });
    }

    const userIcon = L.divIcon({
      className: "",
      html: `
        <div style="
          width:18px;
          height:18px;
          background:#1a73e8;
          border:3px solid white;
          border-radius:50%;
          box-shadow:0 0 0 3px rgba(26,115,232,.25);
        "></div>
      `,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    function createPlaceIcon(isClosedToday = false) {
      return L.divIcon({
        className: "",
        html: `
          <div style="
            width:24px;
            height:24px;
            position:relative;
          ">
            <div style="
              width:22px;
              height:22px;
              background:#d93025;
              border:3px solid white;
              border-radius:50% 50% 50% 0;
              transform:rotate(-45deg);
              transform-origin:center;
              box-shadow:0 2px 8px rgba(0,0,0,.3);
              opacity:${isClosedToday ? ".35" : "1"};
            "></div>
          </div>
        `,
        iconSize: [24, 24],
        iconAnchor: [12, 24],
        popupAnchor: [0, -24]
      });
    }

    function hasCoordinates(place) {
      return Number.isFinite(place.lat) && Number.isFinite(place.lng);
    }

    function isPlaceVisible(place) {
      return activeType === "All" || place.type === activeType;
    }

    function getTodayHours(openingHours) {
      if (!openingHours) {
        return "";
      }

      const dayKey = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][new Date().getDay()];
      return getWeeklyHoursMap(openingHours)[dayKey] || "Unknown";
    }

    function isClosedToday(place) {
      return getTodayHours(place.openingHours) === "Closed";
    }

    function getWeeklyHoursMap(openingHours) {
      return Object.fromEntries(
        openingHours
          .split(";")
          .map(entry => entry.trim())
          .filter(Boolean)
          .map(entry => {
            const match = entry.match(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+(.+)$/);
            return match ? [match[1], match[2].trim()] : null;
          })
          .filter(Boolean)
      );
    }

    function closesNextDay(hoursText) {
      const match = hoursText.match(/^(\d{2}):(\d{2})-(\d{2}):(\d{2})$/);
      if (!match) {
        return false;
      }

      const openMinutes = Number(match[1]) * 60 + Number(match[2]);
      const closeMinutes = Number(match[3]) * 60 + Number(match[4]);
      return closeMinutes <= openMinutes;
    }

    function getTodayHoursText(openingHours) {
      if (!openingHours) {
        return "Today: hours not available";
      }

      const dayKey = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][new Date().getDay()];
      const todayHours = getTodayHours(openingHours);
      const nextDayNote = closesNextDay(todayHours) ? " (closes next day)" : "";
      return `Today (${dayKey}): ${todayHours}${nextDayNote}`;
    }

    function formatFullOpeningHours(openingHours) {
      if (!openingHours) {
        return "Hours not available";
      }

      return openingHours
        .split(";")
        .map(entry => escapeHtml(entry.trim()))
        .filter(Boolean)
        .join("<br>");
    }

    function getPopupContent(place) {
      return `
        <strong>${escapeHtml(place.name)}</strong>
        <div class="popup-hours">${formatFullOpeningHours(place.openingHours)}</div>
        <a href="${escapeHtml(place.googleMapsUrl)}" target="_blank" rel="noopener">Open in Google Maps</a>
      `;
    }

    function renderMarkers() {
      markers.forEach(marker => map.removeLayer(marker));
      markers.length = 0;

      const visiblePlaces = places.filter(isPlaceVisible);

      visiblePlaces
        .filter(hasCoordinates)
        .forEach(place => {
          const marker = L.marker([place.lat, place.lng], { icon: createPlaceIcon(isClosedToday(place)) })
            .addTo(map)
            .bindPopup(getPopupContent(place));

          markers.push(marker);
        });
    }

    function renderFilters() {
      const filters = document.getElementById("filters");
      const types = ["All", ...new Set(places.map(place => place.type))];

      filters.innerHTML = types.map(type => `
        <button
          class="filter-btn ${type === activeType ? "active" : ""}"
          data-type="${escapeHtml(type)}">
          ${escapeHtml(type)}
        </button>
      `).join("");

      filters.querySelectorAll(".filter-btn").forEach(button => {
        button.addEventListener("click", () => setFilter(button.dataset.type));
      });
    }

    function setFilter(type) {
      activeType = type;
      renderFilters();
      renderMarkers();
      renderList();
    }

    function getDistanceMeters(start, end) {
      const earthRadiusMeters = 6371000;
      const toRadians = degrees => degrees * Math.PI / 180;
      const lat1 = toRadians(start.lat);
      const lat2 = toRadians(end.lat);
      const deltaLat = toRadians(end.lat - start.lat);
      const deltaLng = toRadians(end.lng - start.lng);

      const a =
        Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
        Math.cos(lat1) * Math.cos(lat2) *
        Math.sin(deltaLng / 2) * Math.sin(deltaLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return earthRadiusMeters * c;
    }

    function formatDistance(meters) {
      if (meters < 1000) {
        return `${Math.round(meters)} m away`;
      }

      return `${(meters / 1000).toFixed(1)} km away`;
    }

    function getLocationText(place) {
      if (place.distanceMeters !== null) {
        return `Distance: ${formatDistance(place.distanceMeters)}`;
      }

      if (place.hasCoordinates) {
        return "Distance: allow location to sort";
      }

      return "Location: open Google Maps for exact location";
    }

    function focusPlace(index) {
      const place = places[index];
      if (!hasCoordinates(place)) {
        return;
      }

      map.setView([place.lat, place.lng], 17);
      markers.forEach(marker => {
        const markerLatLng = marker.getLatLng();
        if (
          Math.abs(markerLatLng.lat - place.lat) < 0.00001 &&
          Math.abs(markerLatLng.lng - place.lng) < 0.00001
        ) {
          marker.openPopup();
        }
      });
    }

    function renderList() {
      const list = document.getElementById("placeList");

      const visiblePlaces = places
        .map((place, index) => {
          const hasCoordinates = Number.isFinite(place.lat) && Number.isFinite(place.lng);
          const distanceMeters = userLocation && hasCoordinates
            ? getDistanceMeters(userLocation, { lat: place.lat, lng: place.lng })
            : null;

          return { ...place, originalIndex: index, distanceMeters, hasCoordinates };
        })
        .filter(place => activeType === "All" || place.type === activeType)
        .sort((a, b) => {
          if (a.distanceMeters === null || b.distanceMeters === null) {
            return a.originalIndex - b.originalIndex;
          }

          return a.distanceMeters - b.distanceMeters;
        });

      list.innerHTML = visiblePlaces.map(place => `
        <section class="place-card">
          <h2>${escapeHtml(place.name)}</h2>

          <div class="meta">
            ${escapeHtml(getTodayHoursText(place.openingHours))}<br>
            ${escapeHtml(getLocationText(place))}
          </div>

          <div class="actions">
            ${place.hasCoordinates ? `<button type="button" data-place-index="${place.originalIndex}">Show on map</button>` : ""}
            <a href="${escapeHtml(place.googleMapsUrl)}" target="_blank" rel="noopener">Open in Google Maps</a>
          </div>
        </section>
      `).join("");

      list.querySelectorAll("[data-place-index]").forEach(button => {
        button.addEventListener("click", () => {
          focusPlace(Number(button.dataset.placeIndex));
        });
      });
    }

    function locateUser() {
      if (!navigator.geolocation) {
        status.textContent = "Your browser does not support location.";
        return;
      }

      if (!window.isSecureContext) {
        status.textContent = "Location needs HTTPS on iPhone Safari. The saved places are still shown.";
        map.setView(defaultCenter, 13);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          userLocation = { lat, lng };

          L.marker([lat, lng], { icon: userIcon })
            .addTo(map)
            .bindPopup("You are here");

          status.textContent = "Sorted nearest to farthest where coordinates are available.";
          renderList();

          const group = L.featureGroup([
            ...markers,
            L.marker([lat, lng])
          ]);

          map.fitBounds(group.getBounds().pad(0.18));
        },
        () => {
          status.textContent = "Location permission was denied or unavailable.";
          map.setView(defaultCenter, 13);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    async function init() {
      try {
        await loadPlaces();
        renderFilters();
        renderMarkers();
        renderList();
        setupListToggle();
        const readyCount = places.filter(hasCoordinates).length;
        status.textContent = `${readyCount} of ${places.length} map pins loaded from locations.csv.`;
        setTimeout(() => map.invalidateSize(), 250);
        locateUser();
      } catch (error) {
        console.error(error);
        status.textContent = "Could not load locations.csv. Run this page from a local web server or check that the CSV file is next to index.html.";
      }
    }

    init();
  </script>
</body>
</html>
