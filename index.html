<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Penang Food Map</title>

  <!-- Leaflet map library: no Google Maps API key needed for this demo -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root {
      --panel-bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #dddddd;
      --accent: #1a73e8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #f5f5f5;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    #map {
      height: 52vh;
      height: 52dvh;
      min-height: 320px;
      width: 100%;
    }

    .panel {
      flex: 1;
      overflow-y: auto;
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      padding: 12px;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      white-space: nowrap;
    }

    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .place-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }

    .place-card h2 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .meta {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .actions a,
    .actions button {
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      text-decoration: none;
      background: #eef4ff;
      color: var(--accent);
      cursor: pointer;
    }

    .status {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    @media (min-width: 760px) {
      .app {
        flex-direction: row;
      }

      #map {
        height: 100vh;
        height: 100dvh;
        width: 60%;
      }

      .side {
        width: 40%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      header {
        border-left: 1px solid var(--border);
      }

      .panel {
        border-left: 1px solid var(--border);
      }
    }
  </style>
</head>

        <div id="placeList"></div>
      </main>
    </div>
  </div>

      {"name":"The Alley","type":"Coffee","lat":5.4185054,"lng":100.3384157,"openingHours":"","googleMapsUrl":"https://www.google.com/maps/place/The+Alley,+5+Stewart+Lane/@5.4192996,100.3268269,15.18z/data=!4m6!3m5!1s0x304ac38fd7748be3:0xc3f61bcab81cfde4!8m2!3d5.4185054!4d100.3384157!16s%2Fg%2F11b6bbyhjm?entry=ttu&g_ep=EgoyMDI2MDUwNi4wIKXMDSoASAFQAw%3D%3D"},
      {"name":"Narrow Marroe","type":"Coffee","lat":5.4137967,"lng":100.3376003,"openingHours":"","googleMapsUrl":"https://www.google.com/maps/place/Narrow+Marrow/@5.4192996,100.3268269,15.18z/data=!4m6!3m5!1s0x304ac393f15e4765:0x289b200159c1f725!8m2!3d5.4137967!4d100.3376003!16s%2Fg%2F11b7lmr4v3?entry=ttu&g_ep=EgoyMDI2MDUwNi4wIKXMDSoASAFQAw%3D%3D"},
      {"name":"Starbright","type":"Coffee","lat":5.4126559,"lng":100.3291206,"openingHours":"","googleMapsUrl":"https://www.google.com/maps/place/STARBRIGHT+COFFEE/@5.4180027,100.3280673,15.38z/data=!4m6!3m5!1s0x304ac3950860fb3d:0xf62dfaec6e7ab0fe!8m2!3d5.4126559!4d100.3291206!16s%2Fg%2F11fxvfv0ft?entry=ttu&g_ep=EgoyMDI2MDUwNi4wIKXMDSoASAFQAw%3D%3D"},
      {"name":"Sweet bar","type":"Coffee","lat":5.4102037,"lng":100.3305067,"openingHours":"","googleMapsUrl":"https://www.google.com/maps/place/Sweetbar+Cafe/@5.4180027,100.3280673,15.38z/data=!4m6!3m5!1s0x304ac324ad7ff989:0x9026a05a06bba6b5!8m2!3d5.4102037!4d100.3305067!16s%2Fg%2F11tjf57myn?entry=ttu&g_ep=EgoyMDI2MDUwNi4wIKXMDSoASAFQAw%3D%3D"},
      {"name":"Alight","type":"Coffee","lat":5.4133506,"lng":100.333887,"openingHours":"","googleMapsUrl":"https://www.google.com/maps/place/Alight+Coffee+(George+Town)/@5.4090695,100.327633,14.93z/data=!4m6!3m5!1s0x304ac3b2fa9fd283:0x160a29a4020f19d5!8m2!3d5.4133506!4d100.333887!16s%2Fg%2F11xtytl_xz?entry=ttu&g_ep=EgoyMDI2MDUwNi4wIKXMDSoASAFQAw%3D%3D"},
      {"name":"義蓮鱼头米粉 Green Tomyam","type":"魚頭米粉","lat":null,"lng":null,"openingHours":"","googleMapsUrl":"https://www.google.com/maps/search/?api=1&query=%E7%BE%A9%E8%93%AE%E9%B1%BC%E5%A4%B4%E7%B1%B3%E7%B2%89%20Green%20Tomyam"},
      {"name":"鄉下魚頭米粉","type":"魚頭米粉","lat":null,"lng":null,"openingHours":"","googleMapsUrl":"https://www.google.com/maps/search/?api=1&query=%E9%84%89%E4%B8%8B%E9%AD%9A%E9%A0%AD%E7%B1%B3%E7%B2%89"},
      {"name":"雲吞面之家","type":"Wantan Mee","lat":null,"lng":null,"openingHours":"","googleMapsUrl":"https://www.google.com/maps/search/?api=1&query=%E9%9B%B2%E5%90%9E%E9%9D%A2%E4%B9%8B%E5%AE%B6"},
      {"name":"New Day Porridge","type":"Porridge","lat":null,"lng":null,"openingHours":"","googleMapsUrl":"https://www.google.com/maps/search/?api=1&query=New%20Day%20Porridge"},
      {"name":"富二代","type":"港點","lat":null,"lng":null,"openingHours":"","googleMapsUrl":"https://www.google.com/maps/search/?api=1&query=%E5%AF%8C%E4%BA%8C%E4%BB%A3"}
    ];

    const defaultCenter = [5.4141, 100.3288]; // George Town, Penang

    const map = L.map("map", {
      zoomControl: true
    }).setView(defaultCenter, 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }).addTo(map);

    const markers = [];
    let activeType = "All";
    let userLocation = null;

    const userIcon = L.divIcon({
      className: "",
      html: `
        <div style="
          width:18px;
          height:18px;
          background:#1a73e8;
          border:3px solid white;
          border-radius:50%;
          box-shadow:0 0 0 3px rgba(26,115,232,.25);
        "></div>
      `,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    const placeIcon = L.divIcon({
      className: "",
      html: `
        <div style="
          width:22px;
          height:22px;
          background:#d93025;
          border:3px solid white;
          border-radius:50% 50% 50% 0;
          transform:rotate(-45deg);
          box-shadow:0 2px 8px rgba(0,0,0,.3);
        "></div>
      `,
      iconSize: [22, 22],
      iconAnchor: [11, 22]
    });

    function renderMarkers() {
      markers.forEach(marker => map.removeLayer(marker));
      markers.length = 0;

      const visiblePlaces = places.filter(place => {
        return place.lat !== null &&
          place.lng !== null &&
          (activeType === "All" || place.type === activeType);
      });

      visiblePlaces.forEach(place => {
        const marker = L.marker([place.lat, place.lng], { icon: placeIcon })
          .addTo(map)
          .bindPopup(`
            <strong>${place.name}</strong><br>
            ${place.type}<br>
            ${place.openingHours}<br>
            <a href="${place.googleMapsUrl}" target="_blank" rel="noopener">Open in Google Maps</a>
          `);

        markers.push(marker);
      });
    }

    function renderFilters() {
      const filters = document.getElementById("filters");
      const types = ["All", ...new Set(places.map(place => place.type))];

      filters.innerHTML = types.map(type => `
        <button
          class="filter-btn ${type === activeType ? "active" : ""}"
          onclick="setFilter('${type}')">
          ${type}
        </button>
      `).join("");
    }

    function setFilter(type) {
      activeType = type;
      renderFilters();
      renderMarkers();
      renderList();
    }

    function getDistanceMeters(start, end) {
      const earthRadiusMeters = 6371000;
      const toRadians = degrees => degrees * Math.PI / 180;
      const lat1 = toRadians(start.lat);
      const lat2 = toRadians(end.lat);
      const deltaLat = toRadians(end.lat - start.lat);
      const deltaLng = toRadians(end.lng - start.lng);

      const a =
        Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
        Math.cos(lat1) * Math.cos(lat2) *
        Math.sin(deltaLng / 2) * Math.sin(deltaLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

      return earthRadiusMeters * c;
    }

    function formatDistance(meters) {
      if (meters < 1000) {
        return `${Math.round(meters)} m away`;
      }

      return `${(meters / 1000).toFixed(1)} km away`;
    }

    function getLocationText(place) {
      if (place.distanceMeters !== null) {
        return `Distance: ${formatDistance(place.distanceMeters)}`;
      }

      if (place.hasCoordinates) {
        return "Distance: allow location to sort";
      }

      return "Location: open Google Maps for exact location";
    }

    function focusPlace(index) {
      const place = places[index];
      if (place.lat === null || place.lng === null) {
        return;
      }

      map.setView([place.lat, place.lng], 17);
      markers.forEach(marker => {
        const markerLatLng = marker.getLatLng();
        if (
          Math.abs(markerLatLng.lat - place.lat) < 0.00001 &&
          Math.abs(markerLatLng.lng - place.lng) < 0.00001
        ) {
          marker.openPopup();
        }
      });
    }

    function renderList() {
      const list = document.getElementById("placeList");

      const visiblePlaces = places
        .map((place, index) => {
          const hasCoordinates = place.lat !== null && place.lng !== null;
          const distanceMeters = userLocation && hasCoordinates
            ? getDistanceMeters(userLocation, { lat: place.lat, lng: place.lng })
            : null;

          return { ...place, originalIndex: index, distanceMeters, hasCoordinates };
        })
        .filter(place => activeType === "All" || place.type === activeType)
        .sort((a, b) => {
          if (a.distanceMeters === null || b.distanceMeters === null) {
            return a.originalIndex - b.originalIndex;
          }

          return a.distanceMeters - b.distanceMeters;
        });

      list.innerHTML = visiblePlaces.map(place => `
        <section class="place-card">
          <h2>${place.name}</h2>

          <div class="meta">
            Type: ${place.type}<br>
            ${place.openingHours ? `Opening: ${place.openingHours}<br>` : ""}
            ${getLocationText(place)}
          </div>

          <div class="actions">
            ${place.hasCoordinates ? `<button onclick="focusPlace(${place.originalIndex})">Show on map</button>` : ""}
            <a href="${place.googleMapsUrl}" target="_blank" rel="noopener">Open in Google Maps</a>
          </div>
        </section>
      `).join("");
    }

    function locateUser() {
      if (!navigator.geolocation) {
        status.textContent = "Your browser does not support location.";
        return;
      }

      if (!window.isSecureContext) {
        status.textContent = "Location needs HTTPS on iPhone Safari. The saved places are still shown.";
        map.setView(defaultCenter, 13);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          userLocation = { lat, lng };

          L.marker([lat, lng], { icon: userIcon })
            .addTo(map)
            .bindPopup("You are here");

          status.textContent = "Sorted nearest to farthest where coordinates are available.";
          renderList();

          const group = L.featureGroup([
            ...markers,
            L.marker([lat, lng])
          ]);

          map.fitBounds(group.getBounds().pad(0.18));
        },
        error => {
          status.textContent = "Location permission was denied or unavailable.";
          map.setView(defaultCenter, 13);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    renderFilters();
    renderMarkers();
    renderList();
    setTimeout(() => map.invalidateSize(), 250);
    locateUser();
  </script>
